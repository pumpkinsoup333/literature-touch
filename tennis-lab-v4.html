<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LT · Tennis Lab v4</title>
<style>
:root{
  --bg:#f5f2ea;
  --card:#fffdf8;
  --text:#262622;
  --muted:#77736a;
  --line:#ded9cd;
  --accent:#2f5f49;
  --miss:#8a5b2c;
  --wall:#c1c7c0;
  --floor:#d7b170;
  --courtline:#9f7a46;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}
h1{font-size:22px;margin:0 0 5px}
.sub,.hint{color:var(--muted);font-size:13px;line-height:1.55}
.arena{margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#d0d6d0}
svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.wall{fill:var(--wall)}
.floor{fill:var(--floor)}
.courtline{stroke:var(--courtline);stroke-width:1.4}
.netpost{stroke:#5d6d70;stroke-width:2.1}
.net{stroke:#d9ebeb;stroke-width:1.05}
.stick{fill:none;stroke:#171717;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.head{fill:#fffdf8;stroke:#171717;stroke-width:3.8}
.racket{fill:none;stroke:#171717;stroke-width:3.1}
.racket-string{stroke:#777;stroke-width:.65;opacity:.55}
.ball{fill:#dfff3f;stroke:#7d8d0e;stroke-width:1.6}
.shadow{fill:rgba(0,0,0,.13)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{border:0;border-radius:13px;padding:12px;font-weight:650;font-size:14px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.soft{background:#e7efe9;color:var(--accent)}
.sand{background:#f5eadb;color:var(--miss)}
.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;font-size:13px}
.status b{color:var(--accent)}
.status.miss b{color:var(--miss)}
.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}
@media(max-width:520px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>LT · Tennis Lab v4</h1>
    <div class="sub">这版重点修两个问题：球必须明显可见，而且动作改成更接近网球正手的三段——降拍头、击球、收拍。</div>
  </div>

  <section class="card">
    <div class="arena">
      <svg viewBox="0 0 800 450" id="scene" aria-label="Tennis stick figure animation v4">
        <rect class="wall" x="0" y="0" width="800" height="300"/>
        <rect class="floor" x="0" y="300" width="800" height="150"/>
        <line class="courtline" x1="0" y1="320" x2="800" y2="320"/>
        <line class="courtline" x1="95" y1="300" x2="70" y2="450"/>
        <line class="courtline" x1="705" y1="300" x2="730" y2="450"/>
        <line class="courtline" x1="0" y1="382" x2="800" y2="382"/>

        <line class="netpost" x1="400" y1="248" x2="400" y2="330"/>
        <line class="netpost" x1="407" y1="255" x2="407" y2="330"/>
        <g>
          <line class="net" x1="400" y1="252" x2="454" y2="304"/>
          <line class="net" x1="400" y1="261" x2="447" y2="306"/>
          <line class="net" x1="400" y1="270" x2="440" y2="308"/>
          <line class="net" x1="400" y1="279" x2="433" y2="310"/>
          <line class="net" x1="400" y1="288" x2="426" y2="312"/>
          <line class="net" x1="400" y1="297" x2="419" y2="314"/>
          <line class="net" x1="407" y1="255" x2="407" y2="315"/>
          <line class="net" x1="416" y1="264" x2="416" y2="315"/>
          <line class="net" x1="425" y1="273" x2="425" y2="315"/>
          <line class="net" x1="434" y1="282" x2="434" y2="315"/>
          <line class="net" x1="443" y1="291" x2="443" y2="315"/>
        </g>

        <ellipse id="bodyShadow" class="shadow" cx="612" cy="382" rx="47" ry="8"/>

        <g id="player">
          <circle id="head" class="head" cx="614" cy="215" r="17"/>
          <path id="spine" class="stick" d="M614,235 Q607,271 610,306"/>
          <path id="armBack" class="stick" d="M610,250 Q591,269 575,289"/>
          <path id="armRacket" class="stick" d="M612,248 Q636,264 659,286"/>
          <path id="legBack" class="stick" d="M610,306 Q591,334 584,369"/>
          <path id="legFront" class="stick" d="M610,306 Q632,333 648,370"/>
          <path id="racketHandle" class="racket" d="M659,286 Q667,298 678,314"/>
          <g id="racketHead" transform="translate(688 326) rotate(-18)">
            <ellipse class="racket" cx="0" cy="0" rx="18" ry="30"/>
            <line class="racket-string" x1="-12" y1="-20" x2="12" y2="20"/>
            <line class="racket-string" x1="-12" y1="-10" x2="12" y2="10"/>
            <line class="racket-string" x1="-12" y1="0" x2="12" y2="0"/>
            <line class="racket-string" x1="-12" y1="10" x2="12" y2="-10"/>
            <line class="racket-string" x1="-12" y1="20" x2="12" y2="-20"/>
          </g>
        </g>

        <ellipse id="ballShadow" class="shadow" cx="112" cy="382" rx="10" ry="3" opacity="0"/>
        <circle id="ball" class="ball" cx="112" cy="256" r="8" opacity="0"/>
      </svg>
    </div>

    <div class="status" id="status"><span id="statusText"><b>准备好了。</b> 先看这次球有没有正常出现。</span><span id="score">命中 0 · 漏接 0</span></div>

    <div class="controls">
      <button class="primary" id="random">来一球（随机）</button>
      <button class="soft" id="hit">接到</button>
      <button class="sand" id="miss">漏掉</button>
    </div>

    <div class="note">这版把球改成标准网球配色，并把动作改成更像正手的三段：降拍头 → 前方击球 → 收拍。miss 也会挥完整个动作，只是没对上时间点。</div>
  </section>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const head = $('#head'), spine=$('#spine'), armBack=$('#armBack'), armRacket=$('#armRacket'), legBack=$('#legBack'), legFront=$('#legFront'), racketHandle=$('#racketHandle'), racketHead=$('#racketHead'), ball=$('#ball'), ballShadow=$('#ballShadow'), bodyShadow=$('#bodyShadow'), status=$('#status'), statusText=$('#statusText'), score=$('#score');
  let busy=false, hits=0, misses=0;

  const poses = {
    ready:{
      head:[614,215], spine:[[614,235],[607,271],[610,306]], armBack:[[610,250],[591,269],[575,289]], armRacket:[[612,248],[636,264],[659,286]], legBack:[[610,306],[591,334],[584,369]], legFront:[[610,306],[632,333],[648,370]], racketHandle:[[659,286],[667,298],[678,314]], racket:[688,326,-18], shadow:[612,47]
    },
    drop:{
      head:[606,221], spine:[[605,241],[591,277],[594,312]], armBack:[[597,254],[573,267],[552,281]], armRacket:[[601,250],[626,258],[650,272]], legBack:[[594,312],[575,336],[569,370]], legFront:[[594,312],[618,338],[635,371]], racketHandle:[[650,272],[666,292],[682,313]], racket:[693,327,24], shadow:[602,50]
    },
    contact:{
      head:[620,213], spine:[[618,233],[620,268],[626,303]], armBack:[[619,247],[598,269],[586,292]], armRacket:[[621,244],[646,239],[673,232]], legBack:[[626,303],[607,331],[598,368]], legFront:[[626,303],[645,331],[660,367]], racketHandle:[[673,232],[692,220],[709,212]], racket:[720,206,-42], shadow:[626,52]
    },
    follow:{
      head:[624,212], spine:[[622,234],[631,268],[639,302]], armBack:[[624,247],[605,268],[592,289]], armRacket:[[625,243],[649,233],[672,221]], legBack:[[639,302],[620,331],[610,368]], legFront:[[639,302],[658,329],[674,366]], racketHandle:[[672,221],[692,205],[708,188]], racket:[719,179,-64], shadow:[636,53]
    },
    miss:{
      head:[623,214], spine:[[621,235],[627,270],[633,304]], armBack:[[623,248],[603,270],[591,291]], armRacket:[[624,245],[649,245],[674,248]], legBack:[[633,304],[614,332],[604,368]], legFront:[[633,304],[652,331],[668,367]], racketHandle:[[674,248],[692,242],[710,238]], racket:[721,232,-12], shadow:[632,51]
    },
    recover:{
      head:[616,216], spine:[[615,236],[610,272],[611,306]], armBack:[[611,249],[592,269],[577,289]], armRacket:[[613,248],[637,261],[660,283]], legBack:[[611,306],[592,334],[585,369]], legFront:[[611,306],[633,333],[649,369]], racketHandle:[[660,283],[668,296],[679,311]], racket:[689,322,-20], shadow:[614,48]
    }
  };

  const lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const mixPoint=(a,b,t)=>[lerp(a[0],b[0],t), lerp(a[1],b[1],t)];
  const path3=pts=>`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} Q${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)} ${pts[2][0].toFixed(1)},${pts[2][1].toFixed(1)}`;
  function drawPose(p){
    head.setAttribute('cx',p.head[0]); head.setAttribute('cy',p.head[1]);
    spine.setAttribute('d',path3(p.spine)); armBack.setAttribute('d',path3(p.armBack)); armRacket.setAttribute('d',path3(p.armRacket)); legBack.setAttribute('d',path3(p.legBack)); legFront.setAttribute('d',path3(p.legFront)); racketHandle.setAttribute('d',path3(p.racketHandle)); racketHead.setAttribute('transform',`translate(${p.racket[0]} ${p.racket[1]}) rotate(${p.racket[2]})`); bodyShadow.setAttribute('cx',p.shadow[0]); bodyShadow.setAttribute('rx',p.shadow[1]);
  }
  function mixPose(a,b,t){
    const m={}; m.head=mixPoint(a.head,b.head,t); for(const k of ['spine','armBack','armRacket','legBack','legFront','racketHandle']) m[k]=a[k].map((pt,i)=>mixPoint(pt,b[k][i],t)); m.racket=[lerp(a.racket[0],b.racket[0],t),lerp(a.racket[1],b.racket[1],t),lerp(a.racket[2],b.racket[2],t)]; m.shadow=[lerp(a.shadow[0],b.shadow[0],t),lerp(a.shadow[1],b.shadow[1],t)]; return m;
  }
  function animatePose(from,to,duration){return new Promise(resolve=>{const start=performance.now(); function frame(now){let t=Math.min(1,(now-start)/duration); drawPose(mixPose(from,to,ease(t))); if(t<1) requestAnimationFrame(frame); else resolve();} requestAnimationFrame(frame);});}
  function cubic(p0,p1,p2,p3,t){const u=1-t; return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];}
  function animateBall(mode){
    return new Promise(resolve=>{
      const start=performance.now();
      ball.setAttribute('opacity','1'); ballShadow.setAttribute('opacity','.2');
      const p0=[112,256], p1=[280,225], p2=[500,215], contact=[690,216];
      const return1=[585,175], return2=[410,155], return3=[240,188];
      const miss1=[735,220], miss2=[760,245], miss3=[795,275];
      function frame(now){
        const t=Math.min(1,(now-start)/1000);
        let p;
        if(mode==='hit'){
          if(t<0.72){ p=cubic(p0,p1,p2,contact,t/0.72); }
          else { p=cubic(contact,return1,return2,return3,(t-0.72)/0.28); }
        } else {
          p=cubic(p0,p1,p2,miss1,Math.min(1,t/0.82));
          if(t>0.82){ p=cubic(miss1,[748,228],miss2,miss3,(t-0.82)/0.18); }
        }
        ball.setAttribute('cx',p[0]); ball.setAttribute('cy',p[1]);
        ballShadow.setAttribute('cx',p[0]); ballShadow.setAttribute('rx', 8 + Math.max(0, (260-p[1])*0.03));
        if(t<1) requestAnimationFrame(frame);
        else { setTimeout(()=>{ball.setAttribute('opacity','0'); ballShadow.setAttribute('opacity','0'); resolve();},70); }
      }
      requestAnimationFrame(frame);
    });
  }

  async function play(mode){
    if(busy) return; busy=true; status.className='status'; drawPose(poses.ready);
    statusText.innerHTML='<b>准备动作。</b> 先转体，再把拍头降下来。';
    const ballAnim=animateBall(mode);
    await animatePose(poses.ready, poses.drop, 260);
    await new Promise(r=>setTimeout(r,120));
    statusText.innerHTML = mode==='hit' ? '<b>击球。</b> 在身体前方把球送出去。' : '<b>挥拍。</b> 动作做出来了，只是时间没对上。';
    await animatePose(poses.drop, mode==='hit' ? poses.contact : poses.miss, 290);
    await new Promise(r=>setTimeout(r,80));
    statusText.innerHTML = mode==='hit' ? '<b>收拍。</b> 让拍子顺势走完。' : '<b>漏接。</b> 球飞过去了，动作还是完整收回来。';
    await animatePose(mode==='hit' ? poses.contact : poses.miss, mode==='hit' ? poses.follow : poses.follow, 240);
    await ballAnim;
    await animatePose(poses.follow, poses.recover, 240);
    await animatePose(poses.recover, poses.ready, 180);
    if(mode==='hit'){ hits++; statusText.innerHTML='<b>这一球接到了。</b> 正常回过去了。'; }
    else { misses++; status.className='status miss'; statusText.innerHTML='<b>这一球没接到。</b> 只是这一球而已，下一球还会来。'; }
    score.textContent=`命中 ${hits} · 漏接 ${misses}`;
    busy=false;
  }

  $('#random').onclick=()=>play(Math.random()<0.6?'hit':'miss');
  $('#hit').onclick=()=>play('hit');
  $('#miss').onclick=()=>play('miss');
  drawPose(poses.ready);
})();
</script>
</body>
</html>
